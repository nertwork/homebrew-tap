name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Formula Syntax Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Ruby Syntax Validation
        run: |
          echo "Validating Ruby syntax on all Formulae..."
          find Formula -name "*.rb" -exec ruby -c {} +

      - name: Formula Structure & URL Audit
        run: |
          for f in Formula/*.rb; do
            [ -f "$f" ] || continue
            echo "Checking $f structure..."
            grep -q "class " "$f" || { echo "Missing class definition in $f"; exit 1; }
            grep -q "desc " "$f" || { echo "Missing desc in $f"; exit 1; }
            grep -q "homepage " "$f" || { echo "Missing homepage in $f"; exit 1; }
            grep -q "url " "$f" || { echo "Missing url in $f"; exit 1; }
            grep -q "sha256 " "$f" || { echo "Missing sha256 in $f"; exit 1; }
            grep -q "def install" "$f" || { echo "Missing install in $f"; exit 1; }
            grep -q "test do" "$f" || { echo "Missing test block in $f"; exit 1; }
            echo "Formula $f validated successfully."
          done

      - name: Zero-PII & Secret Audit
        run: |
          echo "Scanning for sensitive tokens or private keys..."
          ! grep -rnE "BEGIN [A-Z]+ PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{36,}|AKIA[0-9A-Z]{16}" Formula/ README.md
