# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: true
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: true
  poem: true

  labeling_instructions:
    - label: "formula"
      instructions: "Apply when files under Formula/*.rb are added or updated."
    - label: "bug"
      instructions: "Apply when the PR fixes formula installation, bottle URL/sha256, service startup, or CI defects."
    - label: "documentation"
      instructions: "Apply when README.md, SECURITY.md, or markdown docs are modified."
    - label: "ci/cd"
      instructions: "Apply when .github/workflows/** or .coderabbit.yaml are modified."

  path_instructions:
    - path: "Formula/**/*.rb"
      instructions: |
        Review Homebrew Ruby formulae for:
        1. Valid Ruby syntax and Homebrew Formula DSL conventions (desc, homepage, url, sha256, version, license, bottle block, install, caveats, service, test do).
        2. Matching source archive url/sha256, bottle root_url/sha256, version string, and test assertions.
        3. Zero personal phone numbers, names, private hostnames, or credentials.
    - path: ".github/workflows/**"
      instructions: |
        Verify CI syntax validation (ruby -c), formula structure assertions, and Zero-PII/secret checks.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  tools:
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true
